name: test-capability-plan
on:
  pull_request:
    paths:
      - 'skills/orchestration/handback/**'
      - '.github/workflows/test-capability-plan.yml'
  push:
    branches: [main]
    paths:
      - 'skills/orchestration/handback/**'
      - '.github/workflows/test-capability-plan.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python -m pytest skills/orchestration/handback/tests/ -v
