name: test-unhobble

# Python test gate for the `unhobble` skill (skills/governance/unhobble/).
# Path-filtered so it runs ONLY when that skill changes — the monorepo's
# tests-optional default (lint-skill-md.yml) stands everywhere else.
#
# The dogfood step is the load-bearing one: unhobble audits its own SKILL.md
# and fails if the skill preaches judgement framing while being written as pure
# prohibition. That check has already caught a real regression in this file's
# own history.

on:
  pull_request:
    paths:
      - 'skills/governance/unhobble/**'
      - '.github/workflows/test-unhobble.yml'
  push:
    branches: [main]
    paths:
      - 'skills/governance/unhobble/**'
      - '.github/workflows/test-unhobble.yml'
  workflow_dispatch:

concurrency:
  group: test-unhobble-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: skills/governance/unhobble

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev deps
        run: pip install -r tests/requirements-dev.txt
      - name: Unit + integration tests
        run: python -m pytest tests/ -v
      - name: Dogfood — unhobble audits its own SKILL.md
        run: python3 scripts/context_audit.py SKILL.md --repo-root . --budget 3000

  tokenizer-fallback:
    name: estimator path (no tiktoken)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest only (tiktoken deliberately absent)
        run: pip install pytest
      - name: Tests must pass on the chars-per-token estimator too
        working-directory: skills/governance/unhobble
        run: python -m pytest tests/ -q
