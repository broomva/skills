name: lint-skill-versions

# Enforces per-skill SemVer consistency across the monorepo. A skill is
# "versioned" iff its SKILL.md frontmatter declares a `version`; for those,
# the version must be valid SemVer, agree across pyproject.toml / package.json,
# and have a matching CHANGELOG section. Unversioned (pre-release) skills are
# exempt. See scripts/lint_skill_versions.py + CONTRIBUTING.md.

on:
  pull_request:
    paths:
      - 'skills/**/SKILL.md'
      - 'skills/**/pyproject.toml'
      - 'skills/**/package.json'
      - 'skills/**/CHANGELOG.md'
      - 'scripts/lint_skill_versions.py'
      - 'tests/test_lint_skill_versions.py'
      - '.github/workflows/lint-skill-versions.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**/SKILL.md'
      - 'skills/**/pyproject.toml'
      - 'skills/**/package.json'
      - 'skills/**/CHANGELOG.md'
      - 'scripts/lint_skill_versions.py'
      - 'tests/test_lint_skill_versions.py'
      - '.github/workflows/lint-skill-versions.yml'
  workflow_dispatch:

jobs:
  lint-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml pytest

      - name: Unit tests for the linter
        run: python3 -m pytest tests/test_lint_skill_versions.py -v

      - name: Lint skill versions
        run: python3 scripts/lint_skill_versions.py

      - name: The gate can actually go red
        # A lint step that only ever reports CLEAN passes just as well when the
        # linter is broken and finds nothing — which is precisely the defect
        # this PR fixes, one layer up. Prove the red path from CI.
        run: |
          mkdir -p skills/tooling/zzz-ci-probe
          printf -- '\xef\xbb\xbf---\nname: zzz-ci-probe\ndescription: Probe.\nversion: not-semver\n---\n' \
            > skills/tooling/zzz-ci-probe/SKILL.md
          set +e
          python3 scripts/lint_skill_versions.py > /tmp/probe.txt 2>&1
          code=$?
          set -e
          rm -rf skills/tooling/zzz-ci-probe
          # Exit 1 EXACTLY and no traceback. A crash also exits non-zero, and a
          # crash whose message happens to contain the probe path would satisfy
          # a laxer check while proving the linter cannot RUN rather than that
          # it can detect.
          if [ "$code" -ne 1 ]; then
            echo "::error::a BOM-prefixed manifest must exit 1, got $code"
            cat /tmp/probe.txt; exit 1
          fi
          if grep -q 'Traceback' /tmp/probe.txt; then
            echo "::error::the lint crashed instead of reporting"
            cat /tmp/probe.txt; exit 1
          fi
          grep -q 'zzz-ci-probe' /tmp/probe.txt || {
            echo "::error::the lint went red but never named the skill"
            cat /tmp/probe.txt; exit 1; }
          echo "a BOM-prefixed manifest is reported by name, exit 1, no crash"

      - name: The gate also catches an unreadable PACKAGE manifest
        # A second probe for the sibling readers, because the SKILL.md probe
        # alone would stay green if only that one reader were fixed.
        run: |
          mkdir -p skills/tooling/zzz-pkg-probe
          printf -- '---\nname: zzz-pkg-probe\ndescription: Probe.\nversion: 1.0.0\n---\n' \
            > skills/tooling/zzz-pkg-probe/SKILL.md
          printf '## [1.0.0]\n- x\n' > skills/tooling/zzz-pkg-probe/CHANGELOG.md
          printf '{"version": ' > skills/tooling/zzz-pkg-probe/package.json
          set +e
          python3 scripts/lint_skill_versions.py > /tmp/pkg.txt 2>&1
          code=$?
          set -e
          rm -rf skills/tooling/zzz-pkg-probe
          if [ "$code" -ne 1 ]; then
            echo "::error::an unreadable package.json must exit 1, got $code"
            cat /tmp/pkg.txt; exit 1
          fi
          grep -q 'zzz-pkg-probe' /tmp/pkg.txt || {
            echo "::error::the lint went red but never named the skill"
            cat /tmp/pkg.txt; exit 1; }
          echo "an unreadable package.json is reported by name"
