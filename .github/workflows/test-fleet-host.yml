name: test-fleet-host

# Python + shell test gate for the `fleet-host` skill (skills/compute/fleet-host/).
# Path-filtered so it runs ONLY when skills/compute/fleet-host/** changes — the
# monorepo's tests-optional default (lint-skill-md.yml) stands everywhere else.

on:
  pull_request:
    paths:
      - 'skills/compute/fleet-host/**'
      - '.github/workflows/test-fleet-host.yml'
  push:
    branches: [main]
    paths:
      - 'skills/compute/fleet-host/**'
      - '.github/workflows/test-fleet-host.yml'
  workflow_dispatch:

concurrency:
  group: test-fleet-host-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: skills/compute/fleet-host

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev deps
        run: pip install -r tests/requirements-dev.txt
      - name: Unit tests (ledger, revocation proofs, WIP rescue on real git repos)
        run: python -m pytest tests/ -v
      - name: Shell syntax check
        run: bash -n scripts/fleet-host/startup.sh scripts/fleet-host/idle-stop.sh
