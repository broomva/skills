name: lint-skill-catalog

# Keeps the three catalog surfaces honest against what is actually on disk:
#   README.md
#   skills/tooling/skills-catalog/references/skills-inventory.md
#   skills/tooling/skills-catalog/SKILL.md
#
# They were maintained by hand and were wrong essentially always — measured on
# main at 391a76a, disk had 93 skills, README listed 91 while claiming 90, and
# the inventory listed 87, with six shipped skills never catalogued at all.
#
# Runs on ANY change under skills/ (not just to the catalog files), because the
# failure being caught is precisely a skill landing without its catalog row.

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'README.md'
      - 'scripts/lint_skill_catalog.py'
      - 'tests/test_lint_skill_catalog.py'
      - '.github/workflows/lint-skill-catalog.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'README.md'
      - 'scripts/lint_skill_catalog.py'
      - 'tests/test_lint_skill_catalog.py'
      - '.github/workflows/lint-skill-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-skill-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml pytest

      - name: Unit tests for the linter
        run: python3 -m pytest tests/test_lint_skill_catalog.py -v

      - name: The catalog agrees with disk
        run: python3 scripts/lint_skill_catalog.py

      - name: The gate can actually go red
        # A lint step that only ever reports CLEAN passes just as well when the
        # linter is broken and finds nothing. Prove the red path from CI: add a
        # skill on disk with no catalog row and require a non-zero exit.
        run: |
          mkdir -p skills/tooling/zzz-ci-probe
          printf -- '---\nname: zzz-ci-probe\ndescription: Temporary CI probe.\n---\n' \
            > skills/tooling/zzz-ci-probe/SKILL.md
          set +e
          python3 scripts/lint_skill_catalog.py > /tmp/probe.txt 2>&1
          code=$?
          set -e
          rm -rf skills/tooling/zzz-ci-probe
          # Exit 1 EXACTLY, and no traceback: a crash also exits 1, and a crash
          # that happens to mention the probe path would satisfy a laxer check
          # while proving the linter cannot run rather than that it can detect.
          if [ "$code" -ne 1 ]; then
            echo "::error::an uncatalogued skill must exit 1, got $code"
            cat /tmp/probe.txt; exit 1
          fi
          if grep -q 'Traceback' /tmp/probe.txt; then
            echo "::error::the lint crashed instead of reporting"
            cat /tmp/probe.txt; exit 1
          fi
          grep -q 'zzz-ci-probe' /tmp/probe.txt || {
            echo "::error::the lint went red but never named the uncatalogued skill"
            cat /tmp/probe.txt; exit 1; }
          echo "the catalog lint reports an uncatalogued skill by name, exit 1, no crash"

      - name: --fix converges, on a clean tree AND after real drift
        # Two distinct properties, and the first alone is nearly vacuous:
        #   (a) no-op on an already-clean catalog, or every future PR carries churn
        #   (b) converges in ONE pass from actual drift — a second --fix after
        #       repairing something must change nothing further
        run: |
          python3 scripts/lint_skill_catalog.py --fix
          python3 scripts/lint_skill_catalog.py
          git diff --exit-code -- README.md \
            skills/tooling/skills-catalog/references/skills-inventory.md \
            skills/tooling/skills-catalog/SKILL.md \
            || { echo "::error::--fix is not idempotent on a clean catalog"; exit 1; }

          # Introduce real drift, repair it, and require the repair to settle.
          mkdir -p skills/tooling/zzz-converge-probe
          printf -- '---\nname: zzz-converge-probe\ndescription: Temporary CI probe.\n---\n' \
            > skills/tooling/zzz-converge-probe/SKILL.md
          python3 scripts/lint_skill_catalog.py --fix
          for f in README.md \
                   skills/tooling/skills-catalog/references/skills-inventory.md \
                   skills/tooling/skills-catalog/SKILL.md; do
            cp "$f" "/tmp/$(basename "$f").pass1"
          done
          python3 scripts/lint_skill_catalog.py --fix
          for f in README.md \
                   skills/tooling/skills-catalog/references/skills-inventory.md \
                   skills/tooling/skills-catalog/SKILL.md; do
            cmp -s "$f" "/tmp/$(basename "$f").pass1" || {
              echo "::error::--fix did not converge in one pass for $f"
              diff "/tmp/$(basename "$f").pass1" "$f" | head -20; exit 1; }
          done
          rm -rf skills/tooling/zzz-converge-probe
          git checkout -- README.md \
            skills/tooling/skills-catalog/references/skills-inventory.md \
            skills/tooling/skills-catalog/SKILL.md
          echo "--fix converges in one pass from drift, and is a no-op when clean"
