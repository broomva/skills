name: test-cross-review

# Bash smoke-test gate for the `cross-review` skill (skills/governance/cross-review/).
# Path-filtered: runs ONLY when skills/governance/cross-review/** changes. Recovers the CI
# coverage the standalone broomva/cross-review repo had, since migration drops
# the per-skill .github/ dir (see research/entities/tool/skills-sh.md).

on:
  pull_request:
    paths:
      - 'skills/governance/cross-review/**'
      - '.github/workflows/test-cross-review.yml'
  push:
    branches: [main]
    paths:
      - 'skills/governance/cross-review/**'
      - '.github/workflows/test-cross-review.yml'
  workflow_dispatch:

concurrency:
  group: test-cross-review-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: skills/governance/cross-review

jobs:
  test:
    name: bash smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shellcheck ships on the GitHub runner image. Both scripts and both test
      # files must be clean; mutation-proof.sh is the only one that mutates
      # anything, so a quoting slip there is not a style nit.
      - name: shellcheck
        run: shellcheck scripts/*.sh tests/*.sh

      - name: Tests — cross-review entry point
        run: bash tests/cross-review.test.sh

      # Includes the self-referential case: T15 stubs mutation-proof.sh and
      # requires this same suite to go red. If the suite passed against a
      # stubbed runner, the runner would be committing the defect it detects.
      - name: Tests — mutation-proof runner
        run: bash tests/mutation-proof.test.sh
