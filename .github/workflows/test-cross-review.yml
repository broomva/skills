name: test-cross-review

# Bash smoke-test gate for the `cross-review` skill (skills/governance/cross-review/).
# Path-filtered: runs ONLY when skills/governance/cross-review/** changes. Recovers the CI
# coverage the standalone broomva/cross-review repo had, since migration drops
# the per-skill .github/ dir (see research/entities/tool/skills-sh.md).

on:
  pull_request:
    paths:
      - 'skills/governance/cross-review/**'
      - '.github/workflows/test-cross-review.yml'
  push:
    branches: [main]
    paths:
      - 'skills/governance/cross-review/**'
      - '.github/workflows/test-cross-review.yml'
  workflow_dispatch:

concurrency:
  group: test-cross-review-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: skills/governance/cross-review

jobs:
  test:
    name: bash smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shellcheck ships on the GitHub runner image. Both scripts and both test
      # files must be clean; mutation-proof.sh is the only one that mutates
      # anything, so a quoting slip there is not a style nit.
      - name: shellcheck
        run: shellcheck scripts/*.sh tests/*.sh

      - name: Tests — cross-review entry point
        run: bash tests/cross-review.test.sh

      # Includes the self-referential case: T15 stubs mutation-proof.sh and
      # requires this same suite to go red. If the suite passed against a
      # stubbed runner, the runner would be committing the defect it detects.
      #
      # `env -u MUTATION_PROOF_ACTIVE` is load-bearing. That variable makes T15
      # skip (its recursion guard), and with it set the suite still prints a
      # green summary — CI would then be enforcing 40 checks while believing it
      # enforced 41. Unsetting it, and asserting the full count in the summary
      # line, means the green here cannot quietly shrink.
      # The round budget is the P20 loop controller; a suite CI does not run is
      # the exact defect it exists to remove. The count is asserted for the same
      # reason the mutation-proof step asserts its own: a green summary that
      # quietly shrinks is indistinguishable from one that did not.
      - name: Tests — round budget
        run: |
          set -euo pipefail
          bash tests/round-budget.test.sh | tee /tmp/rb.out
          grep -q "40 passed, 0 failed" /tmp/rb.out

      # Per-rule mutation proof. `--strategy stub` on the whole file leaves 4 of
      # 17 checks passing against a fully neutered target, so every bound and
      # every anti-vacuity rule carries its own mutation instead. Asserting
      # "0 survived" is the point: a survivor means a rule is unenforced.
      - name: Mutation proof — every budget rule
        run: |
          set -euo pipefail
          bash tests/round-budget.mutation.sh | tee /tmp/rbm.out
          grep -q "29 killed, 0 survived" /tmp/rbm.out

      - name: Tests — mutation-proof runner
        run: |
          set -euo pipefail
          env -u MUTATION_PROOF_ACTIVE bash tests/mutation-proof.test.sh | tee /tmp/mp.out
          grep -q "41 passed, 0 failed, 0 skipped" /tmp/mp.out
          grep -q "41 accounted for" /tmp/mp.out
