name: test-skill-evals

# Python test gate for the skill trigger-eval harness (scripts/skill_evals/, BRO-2005).
#
# WHAT THIS GATE COVERS
#   * the harness unit + CLI suite (tests/skill_evals/);
#   * a GRADED replay of a real prompt set — 4 cases x 3 trials of the
#     harness-selftest fixture skill — so the number of graded trials in CI is 12,
#     not 0;
#   * a MUTATION PROOF: the same fixtures are replayed against a copy of the
#     fixture skill whose description has been rewritten to garbage, and the run
#     MUST fail. That is the property the whole harness exists for — a description
#     regression turns the gate RED — asserted on every PR rather than by hand;
#   * the empty-fixture guard: replay with no fixtures must not exit 0.
#
# WHAT THIS GATE DOES NOT COVER
#   * No model is ever called here. CI is replay-only, so it grades the HARNESS,
#     not any skill's real trigger behaviour.
#   * The committed fixtures under tests/skill_evals/fixtures/ are SYNTHETIC
#     (hand-authored by generate.py) and are marked as such; the runner refuses
#     them unless --allow-synthetic-fixtures is passed explicitly. They say
#     nothing about whether checkit — or any real skill — actually fires.
#   * checkit itself has NO committed fixtures. Producing them needs a live
#     recording run (`--record`), which costs money and is done by hand:
#       python3 scripts/skill_evals/runner.py --skill checkit --trials 3 \
#         --record fixtures/checkit
#     Until that lands, "checkit passes its evals" is not a claim this CI backs.
#
# Path-filtered so it runs when the harness, its tests, ANY prompt set, or ANY
# skill description changes — a description edit is precisely what must trigger it.

on:
  pull_request:
    paths:
      - 'scripts/skill_evals/**'
      - 'tests/skill_evals/**'
      - 'skills/**/evals/**'
      - 'skills/**/SKILL.md'
      # A skill's SCRIPTS decide whether the env jail can contain it: a new
      # hardcoded absolute path escapes silently, and
      # test_no_evaluated_skill_resolves_state_from_an_absolute_path is what
      # catches it. Without this filter that guard never ran on the change class
      # it guards (BRO-2018 review).
      - 'skills/**/scripts/**'
      - '.github/workflows/test-skill-evals.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/skill_evals/**'
      - 'tests/skill_evals/**'
      - 'skills/**/evals/**'
      - 'skills/**/SKILL.md'
      # A skill's SCRIPTS decide whether the env jail can contain it: a new
      # hardcoded absolute path escapes silently, and
      # test_no_evaluated_skill_resolves_state_from_an_absolute_path is what
      # catches it. Without this filter that guard never ran on the change class
      # it guards (BRO-2018 review).
      - 'skills/**/scripts/**'
      - '.github/workflows/test-skill-evals.yml'
  workflow_dispatch:

concurrency:
  group: test-skill-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dev deps
        run: pip install -r tests/skill_evals/requirements-dev.txt

      - name: Tests
        run: python -m pytest tests/skill_evals/ -v

      - name: Check registry is dispatchable
        run: python3 scripts/skill_evals/runner.py --list-checks

      # BRO-2018. A live trial runs the skill's own scripts, and ours resolve their
      # state from $HOME (p9's config dir, kg's entire workspace). Asserted here so
      # the jail cannot regress silently between live runs — which are rare, so a
      # regression would otherwise surface as a corrupted p9 store months later.
      - name: ENV JAIL — case paths resolve inside the workspace
        run: |
          set -e
          out=$(python3 scripts/skill_evals/runner.py --verify-jail)
          echo "$out"
          case "$out" in
            *"jail HOLDS"*) : ;;
            *) echo "::error::--verify-jail did not report a holding jail"; exit 1 ;;
          esac
          # That the guard can also say NO is proven in tests/skill_evals/test_jail.py
          # (test_verify_jail_reports_an_escape_when_home_leaks), which the pytest step
          # above runs — a green light wired to nothing is the failure mode, and it is
          # covered there rather than duplicated as shell here.

      - name: Pilot prompt set validates against CHECK_REGISTRY
        run: |
          python3 scripts/skill_evals/runner.py \
            --skill checkit --replay /nonexistent --validate-only

      - name: Committed fixtures are bound to the fixture skill on disk
        run: |
          set -e
          python3 tests/skill_evals/fixtures/harness-selftest/generate.py
          # --porcelain, not `git diff`: it catches an UNTRACKED fixture too, so a
          # newly added case whose fixture was never committed cannot pass silently.
          if [ -n "$(git status --porcelain -- tests/skill_evals/fixtures/harness-selftest)" ]; then
            echo "::error::committed fixtures are stale — regenerate them:"
            echo "::error::  python3 tests/skill_evals/fixtures/harness-selftest/generate.py"
            git --no-pager diff --stat tests/skill_evals/fixtures/harness-selftest
            exit 1
          fi
          echo "fixtures are current"

      - name: Graded replay (12 trials, 2 positive + 2 negative cases)
        run: |
          python3 scripts/skill_evals/runner.py \
            --skill-dir tests/skill_evals/fixtures/harness-selftest/skill \
            --prompts tests/skill_evals/fixtures/harness-selftest/evals/prompts.json \
            --replay tests/skill_evals/fixtures/harness-selftest \
            --trials 3 --allow-synthetic-fixtures \
            --report "$RUNNER_TEMP/selftest-report.json"
          python3 - "$RUNNER_TEMP/selftest-report.json" <<'PY'
          import json, sys
          agg = json.load(open(sys.argv[1]))["aggregate"]
          assert agg["trials"] == 12, f"expected 12 graded trials, got {agg['trials']}"
          assert agg["positive"]["trials"] == 6, agg["positive"]
          assert agg["min_trials_per_case"] >= 2, "a per-case anecdote is not a distribution"
          print(f"graded {agg['trials']} trials, positives {agg['positive']['pass_rate']}")
          PY

      - name: MUTATION PROOF — a garbage description must turn the gate RED
        run: |
          set +e
          cp -R tests/skill_evals/fixtures/harness-selftest/skill "$RUNNER_TEMP/mutated-skill"
          printf -- '---\nname: harness-selftest\ndescription: xxxx\n---\n# body\n' \
            > "$RUNNER_TEMP/mutated-skill/SKILL.md"
          out=$(python3 scripts/skill_evals/runner.py \
            --skill-dir "$RUNNER_TEMP/mutated-skill" \
            --prompts tests/skill_evals/fixtures/harness-selftest/evals/prompts.json \
            --replay tests/skill_evals/fixtures/harness-selftest \
            --trials 3 --allow-synthetic-fixtures 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::harness exited 0 against a skill whose description was replaced"
            echo "::error::with garbage — replay is decoupled from the artifact under test"
            exit 1
          fi
          case "$out" in
            *"STALE FIXTURE"*) : ;;
            *) echo "::error::failed, but not for the artifact-binding reason"; exit 1 ;;
          esac
          echo "mutation proof held (exit $rc): stale-fixture detection is live"

      - name: Replay guard refuses to green on empty fixtures
        run: |
          set +e
          python3 scripts/skill_evals/runner.py \
            --skill checkit --replay "$RUNNER_TEMP/no-fixtures" --threshold 0.0
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::harness exited 0 with no recorded fixtures — false green"
            exit 1
          fi
          echo "replay guard held (exit $rc)"

      # D1. The round-2 gate hoisted only FixtureError into the fixtures-unusable
      # bucket, so a LIVE run whose CLI cannot be launched errored every trial
      # through the OSError arm, `fixtures_unusable` stayed False, --allow-errors
      # forgave the errors and --threshold 0.0 forgave the rate. Exit 0 on a run
      # that graded ZERO trials. Anchored here because the invariant is now a
      # single predicate (graded_trials) and must stay one.
      - name: ZERO-EVIDENCE GUARD — a run that graded nothing cannot exit 0
        run: |
          set +e
          out=$(python3 scripts/skill_evals/runner.py \
            --skill-dir tests/skill_evals/fixtures/harness-selftest/skill \
            --prompts tests/skill_evals/fixtures/harness-selftest/evals/prompts.json \
            --cli "$RUNNER_TEMP/no-such-cli" --no-version-check \
            --trials 2 --allow-errors --threshold 0.0 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::--allow-errors --threshold 0.0 greened a run of 0 graded trials"
            exit 1
          fi
          case "$out" in
            *"trials produced ANY signal"*) : ;;
            *) echo "::error::failed, but not for the zero-evidence reason"; exit 1 ;;
          esac
          echo "zero-evidence guard held (exit $rc)"

      # D2. --threshold lowers the RATE the positive arm must clear; it must not
      # lower the floor of one demonstrated firing. Built by stripping the Skill
      # events out of the recorded positive transcripts — the meta sidecars (and
      # so the artifact binding) stay valid, only the graded content changes, so
      # this exercises the SCORING path and not the fixture guard.
      - name: POSITIVE FLOOR — --threshold 0.0 cannot green a total trigger failure
        run: |
          set -e
          cp -R tests/skill_evals/fixtures/harness-selftest "$RUNNER_TEMP/never-fires"
          python3 - "$RUNNER_TEMP/never-fires" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1]) / "cases"
          stripped = 0
          for jsonl in root.glob("positive-*/trial-*.jsonl"):
              kept = []
              for line in jsonl.read_text().splitlines():
                  if not line.strip():
                      continue
                  ev = json.loads(line)
                  blocks = (ev.get("message") or {}).get("content") or []
                  blocks = blocks if isinstance(blocks, list) else []
                  fires = any(isinstance(b, dict) and b.get("name") == "Skill" for b in blocks)
                  if fires or isinstance(ev.get("tool_use_result"), dict):
                      stripped += 1
                      continue
                  kept.append(line)
              jsonl.write_text("\n".join(kept) + "\n")
          assert stripped, "no Skill events were stripped — the mutation did nothing"
          print(f"stripped {stripped} Skill event(s) from the positive fixtures")
          PY
          set +e
          out=$(python3 scripts/skill_evals/runner.py \
            --skill-dir "$RUNNER_TEMP/never-fires/skill" \
            --prompts "$RUNNER_TEMP/never-fires/evals/prompts.json" \
            --replay "$RUNNER_TEMP/never-fires" \
            --trials 3 --allow-synthetic-fixtures \
            --allow-errors --threshold 0.0 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::--threshold 0.0 greened a suite in which the skill never fired"
            exit 1
          fi
          case "$out" in
            *"ZERO POSITIVE PASSES"*) : ;;
            *) echo "::error::failed, but not for the positive-floor reason"; exit 1 ;;
          esac
          echo "positive floor held (exit $rc)"

      - name: Synthetic fixtures are refused without the explicit opt-in
        run: |
          set +e
          python3 scripts/skill_evals/runner.py \
            --skill-dir tests/skill_evals/fixtures/harness-selftest/skill \
            --prompts tests/skill_evals/fixtures/harness-selftest/evals/prompts.json \
            --replay tests/skill_evals/fixtures/harness-selftest --trials 3
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::hand-authored fixtures graded as if recorded — provenance gate is dead"
            exit 1
          fi
          echo "provenance gate held (exit $rc)"

  # =====================================================================
  # LIVE fixtures — fetched from a release asset, because 20 MB of recorded model
  # output per sweep does not belong in a PUBLIC repo's permanent history (BRO-2030).
  #
  # A SEPARATE JOB, not extra steps in `test`, for one reason: it is the only job with
  # a network dependency, and mixing it into the matrix would make a release-asset
  # outage look like a Python-3.11-vs-3.12 problem.
  #
  # WHAT IT ASSERTS, and why it is not "exit 0". The recorded sweep's own verdict is
  # FAIL for six of seven skills — that is the finding the fixtures exist to carry. So
  # requiring exit 0 would be requiring the fixtures to lie. What is required instead is
  # that they grade to EXACTLY the pinned aggregates in BASELINE.json: 343 graded
  # trials and every pass count. That makes this job a regression lock on both sides —
  # a description edit turns the fixtures stale and replay goes RED before the baseline
  # is reached, and a change in the harness's grading moves a number and is caught here.
  #
  # IT NEVER SKIPS. A missing asset, a checksum mismatch, a wrong file count and a
  # moved number all FAIL, loudly, with the operator's next command in the message. A
  # replay job that shrugs at a missing asset reports green having graded nothing, which
  # is the exact vacuity this whole arc has been closing.
  live-replay:
    name: live fixtures (fetched asset, ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dev deps
        run: pip install -r tests/skill_evals/requirements-dev.txt

      - name: Manifest and baseline are present and agree
        run: |
          set -e
          python3 - <<'PY'
          import json, pathlib
          live = pathlib.Path("tests/skill_evals/fixtures/live")
          man = json.loads((live / "MANIFEST.json").read_text())
          base = json.loads((live / "BASELINE.json").read_text())
          for k in ("asset", "sha256", "url", "release_tag", "files"):
              assert man.get(k), f"MANIFEST.json carries no {k!r}"
          missing = set(man["skills"]) ^ set(base["skills"])
          assert not missing, f"MANIFEST and BASELINE disagree on skills: {sorted(missing)}"
          print(f"asset {man['asset']}  sha256 {man['sha256'][:16]}…  "
                f"{man['files']} files  {len(man['skills'])} skills")
          print(f"baseline pins {base['graded_trials_total']} graded trials")
          PY

      - name: FETCH the fixture asset (fails loudly when absent or mismatched)
        run: |
          set -e
          python3 scripts/skill_evals/fixture_pack.py fetch

      - name: Extracted tree matches the manifest
        run: python3 scripts/skill_evals/fixture_pack.py verify

      # The fixtures are PUBLIC when published, and the scrub that made them
      # publishable is a blocklist that fails open. Re-running both gates on every PR
      # is how a rule ADDED later gets applied to an asset published earlier — the only
      # mechanism by which the blocklist's fail-open polarity ever gets narrower.
      - name: Fetched fixtures are scrub-clean
        run: python3 scripts/skill_evals/scrub.py tests/skill_evals/fixtures/live --check

      - name: Independent audit of the fetched fixtures
        run: python3 scripts/skill_evals/fixture_audit.py tests/skill_evals/fixtures/live

      - name: GRADED REPLAY — 343 live trials against the pinned baseline
        run: python3 scripts/skill_evals/fixture_pack.py baseline

      # The other half of the regression lock, asserted end-to-end rather than trusted:
      # editing a description must turn these fixtures STALE. Without this, "replay is
      # bound to the artifact" is a property of the code with no test over the LIVE set.
      - name: MUTATION PROOF — an edited description makes the live fixtures STALE
        run: |
          set -e
          skill_md=$(find skills -type f -path '*/handoff/SKILL.md' | head -1)
          [ -n "$skill_md" ] || { echo "::error::handoff/SKILL.md not found"; exit 1; }
          cp "$skill_md" /tmp/handoff-SKILL.md.orig
          python3 - "$skill_md" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          # Append to the frontmatter description so its sha256 changes and nothing else
          # about the file's structure does.
          s2 = re.sub(r"^(description:.*)$", r"\1 MUTATED-FOR-PROOF",
                      s, count=1, flags=re.M)
          assert s2 != s, "description line not found — the mutation did nothing"
          open(p, "w").write(s2)
          PY
          set +e
          out=$(python3 scripts/skill_evals/runner.py --skill handoff \
            --replay tests/skill_evals/fixtures/live/handoff --trials 3 \
            --allow-errors --threshold 0.0 2>&1)
          rc=$?
          set -e
          cp /tmp/handoff-SKILL.md.orig "$skill_md"
          echo "$out" | tail -20
          if [ "$rc" -eq 0 ]; then
            echo "::error::replay exited 0 against an EDITED description — the live"
            echo "::error::fixtures are decoupled from the artifact under test"
            exit 1
          fi
          case "$out" in
            *"recorded against a different"*|*"STALE"*|*"fixtures unusable"*) : ;;
            *) echo "::error::failed, but not for the artifact-binding reason"; exit 1 ;;
          esac
          echo "artifact binding held over the LIVE set (exit $rc)"
