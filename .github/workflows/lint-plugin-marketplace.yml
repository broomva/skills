name: lint-plugin-marketplace

# Keeps the Claude Code (.claude-plugin/) and Codex (.agents/plugins/,
# .codex-plugin/) plugin manifests in step with skills/<category>/<name>/ on
# disk. All four are generated by scripts/build_plugin_marketplace.py; a skill
# or bucket that lands without regenerating them would be missing from
# `/plugin install` and `codex plugin add`.

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'README.md'
      - '.claude-plugin/**'
      - '.agents/plugins/**'
      - '.codex-plugin/**'
      - 'scripts/build_plugin_marketplace.py'
      - 'tests/test_build_plugin_marketplace.py'
      - '.github/workflows/lint-plugin-marketplace.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'README.md'
      - '.claude-plugin/**'
      - '.agents/plugins/**'
      - '.codex-plugin/**'
      - 'scripts/build_plugin_marketplace.py'
      - 'tests/test_build_plugin_marketplace.py'
      - '.github/workflows/lint-plugin-marketplace.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-plugin-marketplace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pytest

      - name: Unit tests for the generator
        run: python3 -m pytest tests/test_build_plugin_marketplace.py -v

      - name: The plugin manifests agree with disk
        run: python3 scripts/build_plugin_marketplace.py --check

      - name: The gate can actually go red
        # Add a skill on disk without regenerating and require exit 1 naming
        # the drifted manifest, not a crash.
        run: |
          mkdir -p skills/tooling/zzz-ci-probe
          printf -- '---\nname: zzz-ci-probe\ndescription: Temporary CI probe.\n---\n' \
            > skills/tooling/zzz-ci-probe/SKILL.md
          set +e
          python3 scripts/build_plugin_marketplace.py --check > /tmp/probe.txt 2>&1
          code=$?
          set -e
          rm -rf skills/tooling/zzz-ci-probe
          cat /tmp/probe.txt
          [ "$code" -eq 1 ] || { echo "::error::an unregenerated skill must exit 1, got $code"; exit 1; }
          ! grep -q Traceback /tmp/probe.txt || { echo "::error::the generator crashed"; exit 1; }
          grep -q 'marketplace.json' /tmp/probe.txt || { echo "::error::drift not named"; exit 1; }
