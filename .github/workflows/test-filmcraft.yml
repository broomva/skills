name: test-filmcraft

on:
  pull_request:
    paths:
      - 'skills/video/filmcraft/**'
      - 'skills/video/motion-lab/scripts/video_qa.py'
      - 'skills/audio/soundcraft/scripts/audio_qa.py'
      - '.github/workflows/test-filmcraft.yml'
  push:
    branches: [main]
    paths:
      - 'skills/video/filmcraft/**'
      - 'skills/video/motion-lab/scripts/video_qa.py'
      - 'skills/audio/soundcraft/scripts/audio_qa.py'
      - '.github/workflows/test-filmcraft.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-filmcraft-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: skills/video/filmcraft

jobs:
  test:
    name: pytest + mutation proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test deps
        run: |
          pip install pytest
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run unit and contract tests
        run: python -m pytest tests/ -q
      - name: Mutation proof
        run: python tests/mutation_proof.py
