name: lint-skill-md

# Validates every skills/<name>/SKILL.md against the agentskills.io spec:
#   - required frontmatter fields: name + description
#   - `name` is lowercase + hyphens + ≤64 chars, no leading/trailing/consecutive hyphens
#   - `name` matches parent directory name (per spec §Name)
#   - `description` ≤1024 chars (per spec §Description) — RATCHETED, see below
#   - nested sub-skills (e.g. skills/<x>/skills/<sub>/SKILL.md) checked the same way
#
# Implementation + the full ratchet contract: scripts/lint_skill_md.py
# (extracted from an inline heredoc so the gate logic is unit-testable).
#
# Fast (<3s). Hermetic (pure Python + PyYAML, no network).

on:
  pull_request:
    paths:
      - 'skills/**/SKILL.md'
      - 'scripts/lint_skill_md.py'
      - 'tests/test_lint_skill_md.py'
      - '.github/workflows/lint-skill-md.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**/SKILL.md'
      - 'scripts/lint_skill_md.py'
      - 'tests/test_lint_skill_md.py'
      - '.github/workflows/lint-skill-md.yml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml pytest

      - name: Lint SKILL.md frontmatter
        run: python3 scripts/lint_skill_md.py

      - name: Self-test the linter (ratchet rules)
        run: python3 -m pytest tests/test_lint_skill_md.py -q
