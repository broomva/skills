name: test-year-in-ai

# Python test gate for the `year-in-ai` skill (skills/knowledge/year-in-ai/).
# Path-filtered so it runs only when the skill or this workflow changes.
# Python 3.9 is in the matrix on purpose: the scheduled harvest runs under the
# macOS system Python (3.9), because Homebrew's Python hangs under launchd.

on:
  pull_request:
    paths:
      - 'skills/knowledge/year-in-ai/**'
      - '.github/workflows/test-year-in-ai.yml'
  push:
    branches: [main]
    paths:
      - 'skills/knowledge/year-in-ai/**'
      - '.github/workflows/test-year-in-ai.yml'
  workflow_dispatch:

concurrency:
  group: test-year-in-ai-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: skills/knowledge/year-in-ai

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest and zstd
        run: |
          pip install pytest
          command -v zstd || (sudo apt-get update -q && sudo apt-get install -y -q zstd)
      - name: Tests
        run: python -m pytest tests/ -v
