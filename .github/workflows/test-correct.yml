name: test-correct

# Test gate for the `correct` skill (skills/governance/correct/).
# Path-filtered: runs ONLY when skills/governance/correct/** changes.
#
# The skill ships the rule-registry runner. Four suites run, and each one's
# count is asserted: a green summary that quietly shrank is indistinguishable
# from one that never ran.

on:
  pull_request:
    paths:
      - 'skills/governance/correct/**'
      - '.github/workflows/test-correct.yml'
  push:
    branches: [main]
    paths:
      - 'skills/governance/correct/**'
      - '.github/workflows/test-correct.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-correct-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: skills/governance/correct

jobs:
  test:
    name: runner, canary, hook and CLI suites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The suites run under `python3 -I`, which drops the user site; the runner
      # and the suites add it back themselves, so PyYAML goes there.
      - name: Install PyYAML (user site)
        run: python3 -m pip install --user pyyaml

      - name: Vendored files match scripts/VENDORED.json
        run: python3 -I tests/vendored.py

      # Each suite's status is taken from the suite, not from the filter after
      # it: the output goes to a file, and the file is read afterwards. The counts
      # are exact on purpose (a summary that quietly shrank must not pass). When
      # you add or remove a case, change the number here in the same commit; a
      # mismatch prints the count it found.
      - name: Tests — correct.py and the manifest check
        run: |
          set -euo pipefail
          python3 -I tests/test_correct.py > /tmp/correct.out 2>&1 || { cat /tmp/correct.out; exit 1; }
          grep -E '^(Ran |OK|FAILED)' /tmp/correct.out || true
          grep -q '^Ran 147 tests' /tmp/correct.out || { echo "expected: Ran 147 tests"; exit 1; }
          grep -q '^OK$' /tmp/correct.out || { echo "expected a bare OK (no skips)"; exit 1; }

      - name: Tests — the branch-first hook
        run: |
          set -euo pipefail
          python3 -I tests/test_branch_first_hook.py > /tmp/hook.out 2>&1 || { cat /tmp/hook.out; exit 1; }
          found="$(grep -c '^ok ' /tmp/hook.out || true)"; echo "ok lines: $found (expected 5)"
          test "$found" = 5
          grep -q '^all branch-first hook tests passed$' /tmp/hook.out || { tail -20 /tmp/hook.out; exit 1; }

      - name: Tests — the rule-registry runner
        run: |
          set -euo pipefail
          python3 -I tests/test_rules_check.py > /tmp/check.out 2>&1 || { cat /tmp/check.out; exit 1; }
          found="$(grep -c '^ok ' /tmp/check.out || true)"; echo "ok lines: $found (expected 212)"
          test "$found" = 212
          grep -q '^all rules_check tests passed$' /tmp/check.out || { tail -20 /tmp/check.out; exit 1; }

      - name: Tests — the canary
        run: |
          set -euo pipefail
          python3 -I tests/test_rules_canary.py > /tmp/canary.out 2>&1 || { cat /tmp/canary.out; exit 1; }
          found="$(grep -c '^ok ' /tmp/canary.out || true)"; echo "ok lines: $found (expected 116)"
          test "$found" = 116
          grep -q '^all rules_canary tests passed$' /tmp/canary.out || { tail -20 /tmp/canary.out; exit 1; }

  # Every promise correct.py and the manifest check make is broken once in a
  # copy; the suite must notice each. One job ran them all until the run passed
  # the job's time limit (BRO-4211); now each of four jobs runs every fourth
  # mutant. The count of all mutants is asserted in every shard, so a dropped
  # mutant cannot pass as "0 survived", and a shard must kill all it ran.
  mutation:
    name: mutation proof (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML (user site)
        run: python3 -m pip install --user pyyaml

      - name: Mutation proof — correct.py and tests/vendored.py
        run: |
          set -euo pipefail
          python3 -I tests/mutate_correct.py --shard ${{ matrix.shard }}/4 > /tmp/mutate.out 2>&1 || { cat /tmp/mutate.out; exit 1; }
          cat /tmp/mutate.out
          ran="$(sed -n 's|^shard ${{ matrix.shard }}/4: \([0-9][0-9]*\) of 164 mutants$|\1|p' /tmp/mutate.out)"
          test -n "$ran" || { echo "expected: shard ${{ matrix.shard }}/4: <count> of 164 mutants"; exit 1; }
          grep -q "^${ran} killed, 0 survived$" /tmp/mutate.out
