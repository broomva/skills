name: parallax-web

# Build gate for parallax-web/ — the presentation site for the ontology
# simulation layer (skills/simulation/parallax/).
#
# WHY THIS IS A BUILD GATE AND NOT A DEPLOY.
#
# The site used to publish to GitHub Pages from github.com/broomva/parallax, at
# https://broomva.github.io/parallax/. That repo is archived. An archived repo
# keeps serving its Pages site, so the URL still resolves — but it is FROZEN at
# the last build that repo made, and nothing here republishes it.
#
# This repository has no Pages site at all (`gh api repos/broomva/skills/pages`
# → 404), and enabling one changes broomva/skills' public surface, which is a
# decision that belongs to its own change rather than being smuggled in with a
# directory move. So this workflow proves the site still BUILDS and that its
# asset contract still holds; it deliberately does not claim to have published
# anything. Republishing is tracked separately.
#
# THE ASSET ASSERTIONS ARE THE POINT.
#
# /demo and /scroll-cinema are scroll-driven video scrubbers. Their runtime
# requires exactly clips+1 boundary posters and throws below that — which, on a
# static export, renders a black stage and no error. A Next build over missing
# footage is still a successful build, so the counts are asserted explicitly
# rather than inferred from a green tick.

on:
  pull_request:
    paths:
      - 'parallax-web/**'
      - '.github/workflows/parallax-web.yml'
  push:
    branches: [main]
    paths:
      - 'parallax-web/**'
      - '.github/workflows/parallax-web.yml'
  workflow_dispatch:

concurrency:
  group: parallax-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: static export builds and carries its assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: parallax-web
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Spec citations resolve
        # A spec's `file.ts:123` is a claim about code that moves underneath it.
        # Precision is not accuracy and only one of the two is checkable, so the
        # cited LINE is checked and a bare path -- a file the spec PROPOSES --
        # deliberately is not.
        #
        # It runs before the build because it is fast and because a stale
        # citation is a documentation defect that a green build would otherwise
        # bury. The check fails if it resolved nothing, so deleting the
        # citations is not a way to make it pass.
        run: bun run scripts/check-spec-citations.ts

      - name: Build
        run: bun run build

      - name: The export has to contain every page
        # A build that publishes an empty or half-built directory is still a
        # green check. These are the files whose absence is the whole failure,
        # so they are asserted rather than assumed.
        run: |
          for f in index.html proof/index.html demo/index.html \
                   use-cases/index.html scroll-cinema/index.html .nojekyll; do
            test -f "out/$f" || { echo "::error::out/$f missing"; exit 1; }
          done

      - name: The video scrubbers have the footage their runtime requires
        run: |
          count() { ls $1 2>/dev/null | wc -l | tr -d ' '; }
          clips=$(count 'out/cinema/*.mp4')
          posters=$(count 'out/cinema/*.webp')
          sc_clips=$(count 'out/scroll-cinema/*.mp4')
          sc_posters=$(count 'out/scroll-cinema/p*.webp')
          fail=0
          [ "$clips" = "5" ]      || { echo "::error::expected 5 clips in out/cinema, found $clips"; fail=1; }
          [ "$posters" = "6" ]    || { echo "::error::expected 6 posters in out/cinema, found $posters"; fail=1; }
          [ "$sc_clips" = "6" ]   || { echo "::error::expected 6 clips in out/scroll-cinema, found $sc_clips"; fail=1; }
          [ "$sc_posters" = "7" ] || { echo "::error::expected 7 posters in out/scroll-cinema, found $sc_posters"; fail=1; }
          [ "$fail" = "0" ] || exit 1
          echo "export ok: $(find out -type f | wc -l | tr -d ' ') files, ${clips}+${posters} cinema, ${sc_clips}+${sc_posters} scroll-cinema"

      - name: Say plainly that nothing was published
        # Without this line a green tick beside "parallax-web" reads as "the site
        # is live with these changes". It is not: the published site is frozen on
        # the archived repo. Green here means the export is buildable, nothing more.
        run: |
          {
            echo "## Built, not published"
            echo
            echo "The static export is valid and carries its asset contract."
            echo "**Nothing was deployed.** The published site at"
            echo "<https://broomva.github.io/parallax/> is frozen at the last build"
            echo "made by the now-archived \`broomva/parallax\`, and this repository"
            echo "has no Pages site."
          } >> "$GITHUB_STEP_SUMMARY"
