name: test-soundcraft

on:
  pull_request:
    paths:
      - 'skills/audio/soundcraft/**'
      - '.github/workflows/test-soundcraft.yml'
  push:
    branches: [main]
    paths:
      - 'skills/audio/soundcraft/**'
      - '.github/workflows/test-soundcraft.yml'
  workflow_dispatch:

concurrency:
  group: test-soundcraft-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: skills/audio/soundcraft

permissions:
  contents: read

jobs:
  test:
    name: pytest and mutation proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install pytest
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Mutation proof
        run: python tests/mutation_proof.py
