<!doctype html>
<html><head><meta charset="utf-8"></head><body><canvas id="c" width="160" height="90"></canvas>
<script>
  // From t = 0.5 on, renderAt's SECOND call at a given t spins forever (the warm-up
  // probe makes the first): a synchronous hang in the frame loop blocks the page
  // itself, screenshots included.
  const seen = {};
  window.renderAt = function (t) { if (t >= 0.5 && seen[t]++) { for (;;) {} } seen[t] = seen[t] || 1; };
</script></body></html>
