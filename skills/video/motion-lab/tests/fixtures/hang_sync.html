<!doctype html>
<html><head><meta charset="utf-8"></head><body><canvas id="c" width="160" height="90"></canvas>
<script>
  // renderAt spins forever from t = 0.5 on (past the warm-up probe): a synchronous
  // hang in the frame loop blocks the page itself, screenshots included.
  window.renderAt = function (t) { if (t >= 0.5) { for (;;) {} } };
</script></body></html>
