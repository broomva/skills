<!doctype html>
<html><head><meta charset="utf-8"></head>
<body><canvas id="c" width="160" height="90"></canvas>
<script>
  // renderAt works for early frames and throws past t = 0.5.
  const ctx = document.getElementById('c').getContext('2d');
  window.renderAt = function (t) {
    if (t > 0.5) throw new Error('boom at ' + t);
    ctx.fillRect(t * 100, 10, 10, 10);
  };
</script></body></html>
