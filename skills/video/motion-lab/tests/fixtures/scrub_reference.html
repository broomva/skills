<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}
  .box{position:absolute;top:30px;left:0;width:20px;height:20px;background:#000}</style></head>
<body><div class="box"></div>
<script>
  // Reference for the scrub fixtures: renderAt sets the same transform directly.
  // ?offset=0.25 matches scrub_waapi.html; no offset matches scrub_negdelay.html.
  const off = parseFloat(new URLSearchParams(location.search).get('offset') || '0');
  const box = document.querySelector('.box');
  window.renderAt = function (t) { box.style.transform = `translateX(${Math.min(1, Math.max(0, t - off)) * 120}px)`; };
</script></body></html>
