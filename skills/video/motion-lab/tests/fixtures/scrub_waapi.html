<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}
  .box{position:absolute;top:30px;left:0;width:20px;height:20px;background:#000}</style></head>
<body><div class="box"></div>
<script>
  // renderAt drives a paused WAAPI animation itself, with an offset: frame t shows
  // the animation at (t - 0.25) s, clamped at 0. A renderer that seeks it after
  // renderAt overwrites the offset.
  const a = document.querySelector('.box').animate(
    [{ transform: 'translateX(0)' }, { transform: 'translateX(120px)' }], { duration: 1000, fill: 'both' });
  a.pause();
  window.renderAt = function (t) { a.currentTime = Math.max(0, t - 0.25) * 1000; };
</script></body></html>
