<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}</style></head>
<body><canvas id="c" width="160" height="90"></canvas>
<script>
  // A ?t= check exists and an unrelated if/else satisfies a static "guard wraps"
  // heuristic, but the preview loop starts unconditionally. Under ?t= the live
  // loop keeps drawing over the frozen frame. Only a runtime probe sees that.
  const ctx = document.getElementById('c').getContext('2d');
  const q = new URLSearchParams(location.search);
  const T0 = q.has('t') ? parseFloat(q.get('t')) : 0;
  window.renderAt = function (t) {
    if (t < 0) return;
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 160, 90);
    ctx.fillStyle = '#000'; ctx.fillRect((t * 40) % 150, 40, 10, 10);
  };
  window.renderAt(T0);
  const start = performance.now();
  (function loop(now) { window.renderAt((now - start) / 1000); requestAnimationFrame(loop); })(start);
</script></body></html>
