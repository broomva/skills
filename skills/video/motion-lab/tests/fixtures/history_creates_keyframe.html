<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:#fff}
  .badge{position:absolute;left:60px;top:25px;width:40px;height:40px;background:#000;opacity:0}
  .badge.in{opacity:1;animation:pop 0.3s ease-out both}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
</style></head>
<body><div class="badge"></div><script>
  // Deliberately bad: renderAt reads a call counter and only starts the keyframe
  // after the probe's 12 calls (1 s at 12 fps), at frames 3-4, which the drift
  // samples (0, 6, 11) miss. Only a capture-time identity check sees it.
  const badge = document.querySelector('.badge'); let calls = 0;
  window.renderAt = t => { calls++; badge.classList.toggle('in', calls > 12 && t >= 0.25 && t < 0.34); };
</script></body></html>
