<!doctype html>
<html><head><meta charset="utf-8"></head><body><canvas id="c" width="160" height="90"></canvas>
<script>
  // From t = 0.5 on, renderAt's SECOND call at a given t never settles. The warm-up
  // probe makes the first call at every frame time, so the hang lands in the frame
  // loop and exercises its abort path.
  const seen = {};
  window.renderAt = function (t) { if (t >= 0.5 && seen[t]++) return new Promise(() => {}); seen[t] = seen[t] || 1; };
</script></body></html>
