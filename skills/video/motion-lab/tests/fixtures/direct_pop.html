<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:#fff}
  .badge{position:absolute;left:60px;top:25px;width:40px;height:40px;background:#000}
</style></head>
<body><div class="badge"></div><script>
  const badge = document.querySelector('.badge');
  // Match seekable_pop.html's linear WAAPI pose exactly without creating an animation.
  window.renderAt = t => {
    const progress = Math.min(1, Math.max(0, (t - 0.5) / 0.5));
    badge.style.opacity = String(progress);
    badge.style.transform = `scale(${progress})`;
  };
</script></body></html>
