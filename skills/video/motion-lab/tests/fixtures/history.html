<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}</style></head>
<body><canvas id="c" width="160" height="90"></canvas>
<script>
  // Path-dependent impurity: x accumulates |t - previous t|. Rendered in rising
  // order (with any repeats) x equals t, so an in-order re-render replays the first
  // pass exactly; out of order, x keeps growing. Only a reverse-order check sees it.
  const ctx = document.getElementById('c').getContext('2d');
  let x = 0, prev = 0;
  window.renderAt = function (t) {
    x += Math.abs(t - prev); prev = t;
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 160, 90);
    ctx.fillStyle = '#000'; ctx.fillRect((x * 100) % 150, 40, 10, 10);
  };
</script></body></html>
