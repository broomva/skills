<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:#fff}
  .box{position:absolute;top:30px;left:0;width:20px;height:20px;background:#000}
</style></head>
<body><div class="box"></div><script>
  // A pure page: updatePlaybackRate(0) only takes effect a frame later, so a
  // check right after renderAt sees a running animation at its old rate (P20
  // round 12, stratum B).
  let anim = null;
  window.renderAt = t => {
    if (!anim) {
      anim = document.querySelector('.box').animate(
        [{transform:'translateX(0px)'},{transform:'translateX(100px)'}], {duration:1000, fill:'both'});
    }
    anim.updatePlaybackRate(0);
    anim.play();
    anim.currentTime = t * 1000;
  };
</script></body></html>
