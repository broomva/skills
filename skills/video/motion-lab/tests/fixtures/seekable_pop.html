<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:#fff}
  .badge{position:absolute;left:60px;top:25px;width:40px;height:40px;background:#000}
</style></head>
<body><div class="badge"></div><script>
  const badge = document.querySelector('.badge');
  // This animation exists from load, so renderAt can seek it deterministically.
  const pop = badge.animate(
    [{opacity:0,transform:'scale(0)'},{opacity:1,transform:'scale(1)'}],
    {duration:500, delay:500, fill:'both', easing:'linear'});
  pop.pause();
  window.renderAt = t => { pop.currentTime = t * 1000; };
</script></body></html>
