<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:#fff}
  .badge{position:absolute;left:60px;top:25px;width:40px;height:40px;background:#000;opacity:0}
  .badge.in{opacity:1;animation:pop 0.5s linear both}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
</style></head>
<body><div class="badge"></div><script>
  // Deliberately bad twice: renderAt starts a keyframe at t=0.5, then hangs at
  // t>=0.75. The probe times out after it already saw the keyframe appear; the
  // finding must survive the abort.
  const badge = document.querySelector('.badge');
  window.renderAt = t => {
    if (t >= 0.75) return new Promise(() => {});
    badge.classList.toggle('in', t >= 0.5);
  };
</script></body></html>
