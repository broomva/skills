<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:#fff}
  .box{position:absolute;top:30px;left:0;width:20px;height:20px;background:#000}
</style></head>
<body><div class="box"></div><script>
  // A pure page: renderAt creates the animation and pauses it once it is ready,
  // after renderAt has returned. The probe must judge it after that pause lands,
  // as the capture does (P20 round 12, stratum B; the mirror of
  // plays_from_unawaited_promise.html).
  let anim = null;
  window.renderAt = t => {
    if (!anim) {
      anim = document.querySelector('.box').animate(
        [{transform:'translateX(0px)'},{transform:'translateX(100px)'}], {duration:1000, fill:'both'});
      anim.ready.then(() => anim.pause());
    }
    anim.currentTime = t * 1000;
  };
</script></body></html>
