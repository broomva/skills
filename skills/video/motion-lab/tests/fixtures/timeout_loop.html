<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}</style></head>
<body><canvas id="c" width="160" height="90"></canvas>
<script>
  // A setTimeout chain keeps drawing from the wall clock under ?t=. No rAF and no
  // setInterval, so a call counter on those misses it; a drift check does not.
  const ctx = document.getElementById('c').getContext('2d');
  window.renderAt = function (t) {
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 160, 90);
    ctx.fillStyle = '#000'; ctx.fillRect((t * 40) % 150, 40, 10, 10);
  };
  const start = performance.now();
  (function step() { window.renderAt((performance.now() - start) / 1000); setTimeout(step, 16); })();
</script></body></html>
