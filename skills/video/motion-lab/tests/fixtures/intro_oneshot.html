<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}</style></head>
<body><canvas id="c" width="160" height="90"></canvas>
<script>
  // renderAt is pure, but an unguarded "play once" intro draws an overlay from the
  // wall clock for 1.5 s after load, then stops. It corrupts the first frames and
  // is gone by the end of the render, so only an EARLY drift sample catches it.
  const ctx = document.getElementById('c').getContext('2d');
  window.renderAt = function (t) {
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 160, 90);
    ctx.fillStyle = '#000'; ctx.fillRect((t * 40) % 150, 40, 10, 10);
  };
  const start = performance.now();
  (function intro(now) {
    const k = (now - start) / 1500;
    if (k >= 1) return;
    ctx.fillStyle = `rgba(217,119,87,${1 - k})`; ctx.fillRect(0, 0, 160 * k, 20);
    requestAnimationFrame(intro);
  })(start);
</script></body></html>
