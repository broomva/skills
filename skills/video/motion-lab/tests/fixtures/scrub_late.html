<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:#fff}
  .box{position:absolute;top:30px;left:0;width:20px;height:20px;background:#000;
       animation:slide 1s linear both paused}
  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(120px)}}
</style></head>
<body><div class="box"></div>
<script>
  // A staggered scene: renderAt starts scrubbing only from t = 1.5 s. A probe that
  // sampled only t = 0 and 0.37 x duration saw no change and claimed the animation
  // for the renderer, which then doubled the scrub (P20 round 7).
  const box = document.querySelector('.box');
  window.renderAt = function (t) { box.style.animationDelay = (-Math.max(0, t - 1.5)) + 's'; };
</script></body></html>
