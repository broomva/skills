<!doctype html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:#F4F1EC}</style></head>
<body>
<!-- SVG SMIL motion: not listed by document.getAnimations(), so the renderer
     must seek the SVG timeline itself. No JavaScript at all. -->
<svg width="160" height="90" viewBox="0 0 160 90">
  <circle cx="80" cy="45" r="5" fill="#D97757">
    <animate attributeName="r" from="5" to="40" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>
</body>
</html>
