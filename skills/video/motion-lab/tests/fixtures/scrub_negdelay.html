<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:#fff}
  /* The scrub idiom: a PAUSED animation positioned by a negative animation-delay
     that renderAt drives through a custom property. The page owns this
     animation; a renderer that seeks it anyway doubles its speed. */
  .box{position:absolute;top:30px;left:0;width:20px;height:20px;background:#000;
       animation:slide 1s linear both paused; animation-delay:calc(var(--t, 0) * -1s)}
  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(120px)}}
</style></head>
<body><div class="box"></div>
<script>window.renderAt = function (t) { document.documentElement.style.setProperty('--t', String(t)); };</script>
</body></html>
