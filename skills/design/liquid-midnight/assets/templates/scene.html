<!doctype html>
<html lang="en" data-lm-mode="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquid Midnight · scene</title>
<!--
  Starter scene for Liquid Midnight. Copy it, then edit the CONTENT block and paint().
  ?format=keynote (1920×1080, default) | reel (1080×1920) | feed (1080×1350)
  ?mode=day       paper mode          ?guides=1   show the format's safe zone
  ?t=4.5          deterministic frame (window.renderAt(t) for headless capture; window.__ready when painted)
  Serve over http (ES modules): e.g. `npx serve .` or the skill's scripts/serve.mjs.
-->
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../css/materials.css">
<style>
@font-face{font-family:'Inter';font-weight:300 700;font-display:swap;src:url(../fonts/Inter-400.woff2) format('woff2')}
@font-face{font-family:'Raleway';font-weight:200 600;font-display:swap;src:url(../fonts/Raleway-300.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:300 700;font-display:swap;src:url(../fonts/JetBrainsMono-400.woff2) format('woff2')}
@font-face{font-family:'Roboto Flex';font-weight:400 600;font-display:swap;src:url(../fonts/RobotoFlex-Regular.ttf) format('truetype')}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
/* the stage is authored at native format size and scaled to fit the window */
#stage{position:absolute;left:50%;top:50%;transform-origin:50% 50%;overflow:hidden;background:var(--lm-deep)}
#stage .lm-ambient{position:absolute}
#stage canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.safe{position:absolute;border:2px dashed color-mix(in oklab,var(--lm-coral) 70%,transparent);pointer-events:none;z-index:9;display:none}
[data-guides] .safe{display:block}
.head{position:absolute;z-index:3}
.head .lm-title{margin-top:22px}
.card{position:absolute;z-index:3;width:440px}
.row{position:absolute;z-index:3;display:flex;gap:18px}
.cap{position:absolute;z-index:4;display:flex;justify-content:center}
</style>
</head>
<body class="lm-ground">
<div id="stage">
  <div class="lm-ambient" aria-hidden="true"><i></i><i></i><i></i></div>
  <canvas id="bg" aria-hidden="true"></canvas>
  <canvas id="cv" aria-label="Animated diagram"></canvas>
  <div class="safe" id="safe"></div>

  <!-- CONTENT: replace the copy; keep the grammar (kicker, Raleway 300 title, one <em> payoff in blue) -->
  <header class="head" id="head">
    <div class="lm-kicker">I · Workspaces</div>
    <h1 class="lm-title" id="title">A folder is not <em>a workspace.</em></h1>
  </header>
  <div class="lm-glass lm-card card" id="card">
    <span class="lm-tag"><b></b>Layer 01</span>
    <h3 class="lm-card-title" style="margin-top:10px">Primer</h3>
    <p>Philosophy, routes and hard boundaries.</p>
  </div>
  <div class="row" id="row">
    <div class="lm-glass lm-counter"><small>Sessions</small><b id="c1">000</b></div>
    <div class="lm-glass lm-counter is-gain"><small>Retained</small><b id="c2">000</b></div>
  </div>
  <div class="cap" id="cap"><span class="lm-caption"><mark>memory,</mark> and record that survive.</span></div>
</div>

<script type="module">
import { C, checkTime, createLoop, asciiBackground, beat, fontsReady, hc, installAlphaClamp, metalRing, ORB, orb, readColors, ribbon, Sp, use, glyphTrail, dotRing, TAU } from "../kit/index.js";

const Q = new URLSearchParams(location.search);
const root = document.documentElement;
if (Q.get("mode")) root.dataset.lmMode = Q.get("mode");
if (Q.has("guides")) root.setAttribute("data-guides", "");
if (Q.has("t")) root.setAttribute("data-lm-capture", "");

/* formats and safe zones (tokens.json format.*): content stays inside the safe rect */
const FORMATS = {
  keynote: { w: 1920, h: 1080, safe: { top: 116, right: 140, bottom: 116, left: 140 } },
  reel: { w: 1080, h: 1920, safe: { top: 250, right: 150, bottom: 480, left: 64 } },
  feed: { w: 1080, h: 1350, safe: { top: 80, right: 64, bottom: 120, left: 64 } },
};
const F = FORMATS[Q.get("format")] ?? FORMATS.keynote;
const S = F.safe, SW = F.w - S.left - S.right;
const $ = (id) => document.getElementById(id);
const stage = $("stage");
Object.assign(stage.style, { width: `${F.w}px`, height: `${F.h}px` });
const fit = () => { const k = Math.min(innerWidth / F.w, innerHeight / F.h); stage.style.transform = `translate(-50%,-50%) scale(${k})`; };
fit(); addEventListener("resize", fit);
Object.assign($("safe").style, { left: `${S.left}px`, top: `${S.top}px`, width: `${SW}px`, height: `${F.h - S.top - S.bottom}px` });

/* layout per format */
const reel = F === FORMATS.reel;
const feed = F === FORMATS.feed;
Object.assign($("head").style, { left: `${S.left}px`, top: `${S.top + 12}px`, width: `${SW}px` });
$("title").style.fontSize = reel ? "100px" : F.h === 1350 ? "84px" : "76px";
/* reel grammar (reels/r01): no side card; counters under the diagram; captions bottom-anchored at the 500 px margin */
Object.assign($("card").style, reel || feed ? { display: "none" } : { left: `${S.left}px`, top: `${F.h - S.bottom - 260}px` });
Object.assign($("row").style, reel || feed ? { left: `${S.left}px`, top: reel ? "1100px" : "1110px" } : { right: `${S.right}px`, top: `${F.h - S.bottom - 90}px` });
Object.assign($("cap").style, { bottom: "500px", left: `${S.left}px`, right: `${S.right}px`, display: reel ? "flex" : "none" });

/* canvases at device scale */
installAlphaClamp();
readColors();
const cv = $("cv"), x = cv.getContext("2d"), D = Math.min(2, devicePixelRatio || 1);
cv.width = F.w * D; cv.height = F.h * D; x.setTransform(D, 0, 0, D, 0, 0);
const BG = asciiBackground($("bg"), { day: () => C.day });
BG.fit(F.w, F.h);

/* the diagram's focal point, inside the safe zone */
const O = reel ? [S.left + SW / 2, 840] : feed ? [S.left + SW / 2, 760] : [F.w * 0.66, F.h * 0.5];

/* state that integrates (fixed 1/60 s steps) */
let counters;
const init = () => { counters = [new Sp(0), new Sp(0)]; };
const step = (dt, t) => { counters[0].set(t > 1 ? 128 : 0).step(dt, 0.8, 1); counters[1].set(t > 1.6 ? 96 : 0).step(dt, 0.8, 1); };

/* paint: a pure function of t and the stepped state */
function paint(t) {
  BG.draw(t);
  $("c1").textContent = String(Math.round(counters[0].v)).padStart(3, "0");
  $("c2").textContent = String(Math.round(counters[1].v)).padStart(3, "0");
  for (const [id, t0] of [["head", 0.2], ["card", 0.9], ["row", 1.2], ["cap", 1.6]]) {
    const v = beat(t, t0, 0.6);
    Object.assign($(id).style, { opacity: v, translate: `0 ${(1 - v) * 18}px` });
  }
  use(x); x.clearRect(0, 0, F.w, F.h);
  ORB.attach(cv); ORB.begin(x);
  const a = beat(t, 0.4, 1.2);
  const R = reel || feed ? 300 : 260;
  const reach = reel || feed ? 1.25 : 2.2; // ribbon sources stay on canvas
  const spread = reel || feed ? 0.55 : 0.9; // and clear of the headline
  for (const [i, src] of [[0, [O[0] - R * reach, O[1] - R * spread]], [1, [O[0] - R * reach, O[1] + R * spread]]]) ribbon(hc(src, O), 5, 22, 4, [C.cyan, C.green][i], C.blue, 0.7 * a, t, 6, 1.3);
  dotRing(O[0], O[1], R, R * 0.42, C.t3, 160, 0.5 * a, t * 0.05);
  metalRing(O[0], O[1], R, t, 1.8, a, R * 0.42, 0.6);
  for (let i = 0; i < 3; i++) {
    const th = t * 0.18 + (i / 3) * TAU, c = [C.blue, C.cyan, C.gold][i];
    glyphTrail((k) => [O[0] + Math.cos(th - k * 0.03) * R, O[1] + Math.sin(th - k * 0.03) * R * 0.42], c, 12, 15);
    orb(O[0] + Math.cos(th) * R, O[1] + Math.sin(th) * R * 0.42, 34, c, t + i, a);
  }
  orb(O[0], O[1], reel ? 150 : 130, C.blue, t, a);
  ORB.end();
}

const loop = createLoop({ init, step, paint });
await fontsReady();
await document.fonts.ready;
window.renderAt = (t) => loop.renderAt(t);
if (Q.has("t")) { loop.renderAt(checkTime(Q.get("t"))); window.__ready = true; } else loop.start();
</script>
</body>
</html>
