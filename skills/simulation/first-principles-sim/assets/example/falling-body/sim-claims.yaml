# Claim ledger for a simulation package. Copy to <package>/sim-claims.yaml and
# replace every entry. Audit with:
#
#   python3 scripts/sim_audit.py <package> --run-report --run-mutations
#
# Write the ledger before the code. Each quantity the package states gets one
# claim, and the claim's kind says what enforces it.

# The thing a viewer will see or hear, which no code is allowed to draw.
phenomenon: "A body dropped from higher up takes longer to land."

# Prose that quotes numbers. Every `quoted` string below must appear here.
docs:
  - README.md

tests:
  dir: test
  glob: "*.test.py"
  # Checks that `commands.test` does not run, such as a headless render gate.
  # A claim may name one as its `test`. Each is run by --run-gates.
  #   gates:
  #     - file: tools/render.ts
  #       command: "bun run render"
  gates: []
  # Test helpers and test data that live outside `dir`: a helper's source
  # file, or a directory. Source files there may name reference tables, and a
  # mutation may not touch anything listed.
  support: []
  # Optional: a regular expression that replaces the built-in list of
  # assertion constructs, for a test framework the audit does not know.
  # assertion: "\\bverify\\("

commands:
  # Run from a copy of the package directory. They must not need files
  # outside it.
  test: "for f in test/*.test.py; do python3 $f || exit 1; done"
  # Prints every number the docs quote. Nothing else may be quoted.
  report: "python3 tools/report.py"

# Top-level directories linked into the copy instead of copied. A command that
# writes into one writes into the real one.
link:
  - node_modules

# Published tables, stored with their source. The first 40 lines of each file
# must carry a URL and a fetch date (YYYY-MM-DD), and a test must read the file.
references:
  - id: drop-table
    path: test/reference/drop.txt

claims:
  # Checked kinds need `test`. A checked claim with no mutation is a warning.
  - id: fall-time
    kind: reference          # compared with a published table or value
    statement: "Fall time from 1, 5, 20 and 100 m matches the table within 0.001 s."
    test: test/table.test.py
    reference: drop-table    # or `source: "<citation>"` for one typed-in value
    # Strings, in quotes, with enough digits or a unit to be unmistakable.
    quoted:
      - "1.010 s"

  - id: fall-time-stepped
    kind: independent        # the same quantity computed another way
    statement: "The closed form matches a step-by-step integration within 0.1%."
    test: test/stepped.test.py

  - id: energy
    kind: conservation       # a conservation law or an identity of the equations
    statement: "Kinetic energy at the ground equals the potential energy lost."
    test: test/energy.test.py
    quoted:
      - "9.90 m/s"

  - id: zero-height
    kind: control            # a null input that must give a null output
    statement: "From zero height the fall takes no time."
    test: test/control.test.py

  # Unchecked kinds need only a statement. The docs must label them the same way.
  - id: untimed
    kind: prediction         # a model result with no measurement to compare
    statement: "A real 5 m drop takes 1.010 s. Nobody timed one for this package."

  - id: g-value
    kind: convention         # a choice or typical value, not a measurement
    statement: "g is the standard 9.80665 m/s² everywhere."

  - id: no-drag
    kind: omitted            # physics left out
    statement: "Air drag and buoyancy."

# Small changes to the code under test, usually one line, that must turn a
# test red. Each runs in a copy of the package. `find` must occur exactly once
# in `file`. `file` may not be a test, a gate, a reference table, or anything
# in the tests directory or under `support`.
#
# Give each mutation the command that runs only its claim's test. With the
# whole suite as the command, a mutation is "killed" by whichever assertion
# fails first, which may belong to another claim.
mutations:
  - id: weaker-gravity
    claim: fall-time
    file: src/model.py
    find: "G = 9.80665"
    replace: "G = 9.7"
    command: "python3 test/table.test.py"
  - id: lose-the-factor-two
    claim: fall-time-stepped
    file: src/model.py
    find: "return (2 * height / G) ** 0.5"
    replace: "return (height / G) ** 0.5"
    command: "python3 test/stepped.test.py"
  - id: faster-impact
    claim: energy
    file: src/model.py
    find: "return G * fall_time(height)"
    replace: "return G * fall_time(height) * 1.001"
    command: "python3 test/energy.test.py"
  - id: never-instant
    claim: zero-height
    file: src/model.py
    find: "return (2 * height / G) ** 0.5"
    replace: "return (2 * height / G) ** 0.5 + 1e-6"
    # `command` is optional and defaults to commands.test.
    command: "python3 test/control.test.py"
