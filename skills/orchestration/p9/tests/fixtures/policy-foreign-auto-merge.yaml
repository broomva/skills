version: "1.0"
profile: governed
workspace: broomva-test

ci_watch:
  enabled: true
  max_concurrent_prs: 1
  isolation_tier_map:
    research: none
    docs: none
    code_independent: worktree
    code_dependent: stacked_branch
    governance: blocked

ci_heal:
  enabled: true
  max_attempts: 5
  stability_floor: 0.3
  classified_failure_types: [lint, format, test_flaky, codegen_drift, import_missing]
  escalation_channel:
    linear_team: BRO
    linear_label: ci-heal-escalation
    notify_hook: skills/p9/scripts/p9-escalate-notify.sh

# Another repo's auto_merge block (BRO-2957): the exact key set the SRI repo
# carries. The five keys p9 does not know are consumed by that repo's own
# tooling, not by p9. Values are representative; only the key names matter.
auto_merge:
  enabled: true
  merge_method: squash
  default_action: notify
  base_branch_patterns: [main]
  head_branch_patterns: ["sti-*"]
  migration_paths: ["migrations/"]
  never_auto_merge_labels: [do-not-merge]
  p20:
    pass_score: 7
