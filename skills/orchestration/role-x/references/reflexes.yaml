# role-x reflex catalog (ROLE_X_OUTPUT=reflex). Read by scripts/reflex_router.py.
# Design of record: broomva/workspace docs/specs/2026-09-30-reflex-router-and-ontology-ranked-context.html
# (§5, Design A). Ticket BRO-2674.
#
# Each entry is: trigger clauses -> one reflex line -> the source that states the rule.
#
#   id:        <primitive or kind>.<slug>
#   kind:      primitive | skill | convention (a rule from memory, no primitive of its own)
#   status:    routed (the router may inject it)
#              | listed (a checkable trigger whose routing has not yet cleared the
#                sealed held-out bar, spec §5.5 M3: recall >= 0.60, false fire <= 0.20;
#                `m3:` records the measurement; or one the ablation showed doing harm,
#                `m2:` says what happened)
#              | judgment (a judgment-call trigger no predicate or phrase decides)
#              Only routed entries are injected; the others keep the gap visible.
#   when:      a list of clauses; the entry fires when ANY clause holds. A clause holds
#              when every predicate in `state` holds AND, if it has `prompt` or
#              `phrases`, the prompt matches one of them.
#                state:   names from reflex_router.STATE_PREDICATES (all must hold)
#                prompt:  Python regexes, matched case-insensitively (any)
#                phrases: literal phrases, case-insensitive, on word boundaries (any).
#                         A skill entry's phrases are copied from that skill's
#                         description; a test checks they still are.
#                routes:  names from `routes:` below; their regexes join `prompt`.
#                requires: regexes that must ALL match as well (an artifact, say).
#              In a regex, `[^.?!]` means "same sentence"; a dot followed by a
#              non-space (`.worktrees/`, `README.md`) does not end one.
#   line:      what the stack does, stated as a fact that names the command. Not an
#              order: imperative hook text reads as prompt injection to the model.
#   signature: what a follow-through looks like in a later tool call (for the ledger,
#              spec §5.5 M1): alternatives of {tool, argv_prefix | name | path_re}.
#              reflex_router.signature_matches is the contract: argv_prefix skips
#              env assignments and interpreters and compares basenames without
#              .py/.sh, so `python3 …/p9.py watch` matches [p9, watch]; tool Write
#              also matches Edit and MultiEdit.
#   source:    where the rule is written down. `AGENTS.md` is broomva/workspace's.
#              `memory:` is the operator's auto-memory file of that name.
#   routing:   a skill's trigger-eval set, for `role-x reflexes route --evals`.
#   measured:  optional, a measured effect of injecting this line.
#   priority:  lower ranks first among entries that fire the same way. Rank is
#              state+prompt, then state alone, then prompt alone, then priority.
#
# Budget: at most `max_lines` lines and `max_chars` characters, header included
# (~150 tokens as bytes/4). Lines are atomic: one that does not fit is dropped.
version: 1
max_lines: 3
max_chars: 600

routes:
  # The prompt asks for a change to be made (spec §5.3). Imperative at the start of
  # the prompt or a clause, or asked for ("can you ..."); a question about code is not.
  change_work:
    - '^\W*(please\s+|pls\s+|now\s+|ok\s+|so\s+)?(add|fix|edit|change|update|write|implement|refactor|create|commit|bump|rename|scaffold|build|port|migrate|wire|rewrite|set up)\b'
    - '\b(can|could|would) you\s+(please\s+)?(add|fix|edit|change|update|write|implement|refactor|create|commit|bump|rename|scaffold|build|port|migrate|wire|rewrite|set up)\b'
    - '\b(let''?s|lets|go ahead and|and then|then|and)\s+(add|fix|edit|change|update|write|implement|refactor|create|commit|bump|rename|scaffold|build|port|migrate|wire|rewrite)\b'

reflexes:
  # ------------------------------------------------------------ state predicates
  - id: p9.watch-after-push
    kind: primitive
    primitive: P9
    skill: p9
    skill_source: skills/orchestration/p9/SKILL.md
    routing: skills/orchestration/p9/evals/prompts.json
    status: routed
    priority: 10
    when:
      - state: [branch_pushed_recently]
      - routes: [change_work]
      - prompt:
          - '\b(open|opening|create|raise|put up)\b[^.?!]{0,30}\b(a |the |an )?(pr|pull request)\b'
          - '\bpush(ed|ing)?\b[^.?!]{0,80}\b(pr|pull request|ci|checks?)\b'
          - '\b(open|opening|create|raise)\b[^.?!]{0,30}\b(pr|pull request)\b[^.?!]{0,80}\b(ci|checks?|green|pass(es|ing)?)\b'
          - '\b(let me know|tell me|notify me|ping me)\b[^.?!]{0,40}\b(ci|checks?|build|deploy)\b'
          - '\bwhen (ci|the checks?|the build)\b[^.?!]{0,20}\b(green|pass(es)?|done|finish(es)?)\b'
        phrases: [watch the checks, watch the deploy, waiting on CI, while that runs,
                  let me know when it finishes, notify me when, buzz my phone,
                  is the watcher running, did it notify, productive wait, p9]
    line: "After a push that opens or updates a PR, the stack runs `p9 watch <pr> --background` and works the wait-queue; it does not `sleep` or poll `gh pr checks`."
    signature: [{tool: Bash, argv_prefix: [p9, watch]}]
    source: "AGENTS.md §P9 reflexes 1-2; roles/_meta.md quality_bar; skills/orchestration/p9/SKILL.md"
    measured: "ctx_ablation (#251): p9 watch 6/9 with role-x's quality bar vs 0/9 bare, sonnet + opus"

  - id: p10.branch-first
    kind: primitive
    primitive: P10
    status: routed
    priority: 11
    when:
      - state: [staged_on_default_branch]
      - state: [on_default_branch]
        routes: [change_work]
      - prompt:
          - '\b(switch|checkout|check out|go back)\b[^.?!]{0,20}\b(main|master)\b[^.?!]{0,100}\b(add|fix|edit|change|update|write|commit)\b'
    line: "Change work starts on a branch: `git switch -c <type>/<slug>` before the first edit, also right after `git checkout main`; main moves only through PRs."
    signature: [{tool: Bash, argv_prefix: [git, switch, -c]}, {tool: Bash, argv_prefix: [git, checkout, -b]}]
    source: "memory: MEMORY.md 'BRANCH FIRST' and maestro-build-arc.md (BRO-1819, BRO-1814, BRO-1862); AGENTS.md §P10 reflex 1"

  - id: p4.merge-pinned-to-head
    kind: primitive
    primitive: P4
    status: routed
    priority: 12
    when:
      - prompt:
          - '\bmerge\s+(#?\d{2,6}\b|(the |this |that |my )?(pr|pull request)\b)'
          - '\b(merge|land) it\b(?!\s+(into|with|onto)\b)'
          - '\bland\s+(#?\d{2,6}\b|(the |this |that |my )?(pr|pull request)\b)'
          - '^\W*merge\W*($|,|and\b|now\b|please\b|pls\b|go\b)'
    line: "A merge is pinned to the reviewed head: `gh pr merge <pr> --squash --match-head-commit <head sha>`, or `p9 auto-merge <pr>`, which re-checks the gates and pins it."
    signature: [{tool: Bash, argv_prefix: [gh, pr, merge]}, {tool: Bash, argv_prefix: [p9, auto-merge]}]
    source: "AGENTS.md §P9 reflex 4 and §P4; memory: ci-and-p9-traps.md"

  - id: p10.worktree-removal-guard
    kind: primitive
    primitive: P10
    status: listed
    m2: "sonnet held-out 0/3 (RESULTS-reflex.md): 'the stack copies out' read as automation doing it; one run
      removed the worktree and told the user a hook had backed the files up. Listed until reworded with the
      agent as the actor and re-measured on fresh wordings."
    priority: 13
    when:
      - prompt:
          - '\bworktrees?\b[^.?!]{0,60}\b(remove|delete|drop|clean(\s|-)?up|prune|get rid of|tear down|archive|done with|finished)\b'
          - '\b(remove|removing|delete|drop|clean(\s|-)?up|prune|get rid of|tear down|archive)\b[^.?!]{0,60}\bworktrees?\b'
          - '\bclaude\s+rm\b'
          - '\bgit worktree remove\b'
          - '\barchive_workspace\b'
    line: "Before a worktree is removed (`git worktree remove`, `claude rm`, `archive_workspace`), the stack copies out its ignored files (`git status --ignored`: `.env*`, `*.db`) and runs `lsof +D <path>`."
    signature: [{tool: Bash, argv_prefix: [lsof]}]
    source: "memory: git-and-worktree-traps.md (claude rm measured 2026-09-30, workspace#839)"

  - id: ctx.live-peer-before-git-op
    kind: primitive
    primitive: P5
    status: listed
    m3: "sealed held-out (a272659): recall 1.0, false fire 0.5; routes again once it clears 0.60 / 0.20"
    priority: 14
    # Narrow on purpose: the ctx SessionStart brief already names live peers. This
    # fires at the moment of risk only, a pull/push/commit prompt while a peer is
    # live on this branch (ctx's own liveness rule), or a question about one.
    when:
      - state: [live_peer_on_branch]
        prompt:
          - '\b(pull|push|commit|merge|rebase|reset|stash|checkout|switch|cherry-pick)\b'
          - '\bgit add\b'
      - prompt:
          - '\b(anyone|anybody|someone|another (session|agent))\b[^.?!]{0,40}\b(else|working|here|this (checkout|branch|repo))\b'
    line: "Sessions share checkouts: before a pull, push or `git add -A` the stack reads `ctx board` and leaves a live peer's branch and files alone."
    signature: [{tool: Bash, argv_prefix: [ctx, board]}]
    source: "skills/orchestration/ctx-core/SKILL.md (live definition); AGENTS.md §P5 invariant"

  - id: p9.heal-on-red
    kind: primitive
    primitive: P9
    status: routed
    priority: 15
    when:
      - prompt:
          - '\b(ci|checks|build|pipeline|workflow|check runs?)\b[^.?!]{0,40}\b(fail(ed|ing|s|ure)?|red|broke(n)?|errored)\b'
          - '\b(fail(ed|ing|ure)?|red|broken)\b[^.?!]{0,25}\b(ci|checks|build|pipeline|workflow)\b'
          - '\b(pr|pull request|#\d{2,6})\b[^.?!]{0,40}\b(fail(ed|ing|s)?|red|broke(n)?)\b'
    line: "When a PR's checks fail, the stack runs `p9 heal <pr> --classify` before editing or asking, applies a classified heal inside the PR diff, then re-arms `p9 watch`."
    signature: [{tool: Bash, argv_prefix: [p9, heal]}]
    source: "AGENTS.md §P9 reflex 3"

  # ------------------------------------------------------ memory action rules
  - id: convention.trash-not-rm
    kind: convention
    primitive: P2
    status: routed
    priority: 20
    when:
      - prompt:
          - '\b(delete|remove|drop|clean(\s|-)?up|clear( out)?|get rid of|wipe|nuke|trash|purge)\b[^.?!]{0,60}\b(folders?|dirs?|director(y|ies)|scratch|tmp|temp|copies|clones?|files|logs|outputs?)\b'
          - '\b(folders?|dirs?|director(y|ies)|scratch|copies|clones)\b[^.?!]{0,40}\b(delete|remove|drop|clean(ed)?(\s|-)?up|clear|get rid of|trash)\b'
    line: "Scratch and temp folders are removed with `trash <path>`, which is recoverable; `rm -rf`, `find -delete` and `rmtree` are gated."
    signature: [{tool: Bash, argv_prefix: [trash]}]
    source: "memory: use-trash-not-ask-for-scratch-cleanup.md; workspace delete gate G3"
    measured: "ctx_ablation (#251): trash 3/3 on sonnet and opus with the memory rule inline, 0/3 bare"

  - id: convention.paseo-fleet-listing
    kind: convention
    status: routed
    priority: 21
    when:
      - prompt:
          - '\bpaseo\b[^.?!]{0,80}\b(agents?|sessions?|fleet|running|workers?)\b'
          - '\b(agents?|sessions?|fleet)\b[^.?!]{0,60}\bpaseo\b'
          - '\blist_agents\b'
    line: "The whole Paseo fleet is `list_agents(cwd:\"/\", limit:200)`; the default call sees only the caller's cwd subtree and stops at 50."
    signature: [{tool: mcp, name: list_agents}]
    source: "memory: paseo-sidebar-lists-workspaces-not-agents.md"
    measured: "ctx_ablation (#248): list_agents 3/3 with the memory rule on haiku, 0/3 bare"

