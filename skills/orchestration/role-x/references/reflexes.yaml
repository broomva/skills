          - '\bis (everything|it|this|that) (committed|pushed|merged|green|deployed)\b'
          - '\bcatch me up\b'
    line: "A where-do-we-stand question is answered with a snapshot: `git status`, ahead/behind, `gh pr list`, CI state and open asks, not an essay."
