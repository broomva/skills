    line: "Where a repo has `.control/policy.yaml`, force-pushes, `reset --hard` and branch deletions pass its hard gates (G1-G4); the stack reads `gates.hard` first."
    signature: [{tool: Read, path_re: '\.control/policy\.yaml$'}]
